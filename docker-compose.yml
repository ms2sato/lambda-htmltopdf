services:
  app:
    platform: linux/x86_64
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NODE_VERSION=${NODE_VERSION:-22}
    volumes:
      - .:/var/task
      - /var/task/.git
      - /var/task/node_modules
      - /var/task/.cache
      - ./tmp:/tmp
      - root_npm:/root/.npm
    ports:
      # Host port of the Lambda RIE. Override when another RIE-based function (e.g. lambda-xlsxtopdf) already uses 9000.
      - "${HOST_PORT:-9000}:8080"
    environment:
      - LOCAL=true
      - DEBUG=${DEBUG:-true}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-test-bucket}
      # S3 endpoint used when LOCAL=true (defaults to the localstack service below)
      - S3_ENDPOINT=${S3_ENDPOINT:-http://localstack:4566}

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME-localstack_main}"
    # Pinned to the 4.x community image: 2026.x images require a LocalStack license and exit on startup.
    image: localstack/localstack:4.0
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      - DEBUG=${DEBUG-}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts:/etc/localstack/init/ready.d"

volumes:
  root_npm:
